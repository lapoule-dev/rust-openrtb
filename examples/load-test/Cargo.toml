[package]
name = "load-test"
description = "Goose load test of the demo bidder: randomized OpenRTB 2.6 requests over JSON and protobuf"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
openrtb-model = { path = "../../crates/openrtb-model" }
buffa.workspace = true
goose = "0.18"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
fastrand = "2"
