[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "BSD-3-Clause"
repository = "https://github.com/lapoule-dev/rust-openrtb"

[workspace.dependencies]
buffa = "0.9.2"
buffa-types = "0.9.2"
buffa-build = "0.9.2"
openrtb-json = { path = "crates/openrtb-json" }
adcom = { path = "crates/adcom" }

[profile.bench]
lto = true
codegen-units = 1
