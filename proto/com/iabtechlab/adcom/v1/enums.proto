  // Browser Cookie Sync: Real time cookie sync as described in Appendix: Cookie
  // Based ID Syncing of OpenRTB 2.x
  MATCH_METHOD_BROWSER_COOKIE_SYNC = 2;
  // Authenticated: ID match was based on user authentication such as an email
  // login or hashed PII
  MATCH_METHOD_AUTHENTICATED = 3;
  // Observed: ID match was based on a 1st party observation, but without user
  // authentication (e.g. GUID, SharedID, Session IDs, CHIPS or other 1st party
  // cookies contained in localStorage)
  MATCH_METHOD_OBSERVED = 4;
  // Inference: ID match was inferred from linkage based on non-authenticated
  // features across multiple browsers or devices (e.g. IP address and/or
  // UserAgent)
  MATCH_METHOD_INFERENCE = 5;
}

