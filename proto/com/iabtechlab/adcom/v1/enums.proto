// AdCOM 1.0 List: Plcmt Subtypes - Video. The following table lists the various
// types of video placements in accordance with updated IAB Digital Video
// Guidelines. To be sent using plcmt attribute in Object:Video. Please refer to
// the implementation guide for examples and information on how to use the
// updated signals.
enum VideoPlcmtSubtype {
  // Not in the spec: the zero value open enums require.
  VIDEO_PLCMT_SUBTYPE_UNSPECIFIED = 0;
  // Instream: Pre-roll, mid-roll, and post-roll ads that are played before,
  // during or after the streaming video content that the consumer has requested.
  // Instream video must be set to “sound on” by default at player start, or
  // have explicitly clear user intent to watch the video content. While there
  // may be other content surrounding the player, the video content must be the
  // focus of the user’s visit. It should remain the primary content on the
  // page and the only video player in-view capable of audio when playing. If the
  // player converts to floating/sticky subsequent ad calls should accurately
  // convey the updated player size.
  VIDEO_PLCMT_SUBTYPE_INSTREAM = 1;
  // Accompanying Content: Pre-roll, mid-roll, and post-roll ads that are played
  // before, during, or after streaming video content. The video player loads and
  // plays before, between, or after paragraphs of text or graphical content, and
  // starts playing only when it enters the viewport. Accompanying content should
  // only start playback upon entering the viewport. It may convert to a
  // floating/sticky player as it scrolls off the page.
  VIDEO_PLCMT_SUBTYPE_ACCOMPANYING_CONTENT = 2;
  // Interstitial:Video ads that are played without video content. During
  // playback, it must be the primary focus of the page and take up the majority
  // of the viewport and cannot be scrolled out of view. This can be in
  // placements like in-app video or slideshows.
  VIDEO_PLCMT_SUBTYPE_INTERSTITIAL = 3;
  // No Content/Standalone: Video ads that are played without streaming video
  // content. This can be in placements like slideshows, native feeds, in-content
  // or sticky/floating.
  VIDEO_PLCMT_SUBTYPE_NO_CONTENT_STANDALONE = 4;
  // Pause: An ad present in streaming video content that the consumer has
  // requested. While there may be other content surrounding the player, the
  // video content must be the focus of the user’s visit. It should remain the
  // primary content on the page and the only video player in-view.
  VIDEO_PLCMT_SUBTYPE_PAUSE = 5;
  // Screensaver: An ad present, when OS/App Screen Saver are initiated.
  VIDEO_PLCMT_SUBTYPE_SCREENSAVER = 6;
  // Overlay: Ads occurring during program content and outside of the traditional
  // ad break. The ad format places ad creatives over top of the program content,
  // often as a banner or picture in picture execution. While there may be other
  // content surrounding the player with the overlay, the player with the overlay
  // must be the focus of the user’s visit. It should remain the primary
  // content on the page and the primary video player in-view.
  VIDEO_PLCMT_SUBTYPE_OVERLAY = 7;
  // Squeezeback: Ads Alongside or Adjacent to Content, also known as L-Shape Ads
  // & Double Box, are ads that occur during program content and outside of the
  // traditional ad break. The program content is resized to allow for placement
  // of an ad on the screen. In a squeezeback, none of the content is covered by
  // the ad, instead it shares screen space with the ad. This is the major
  // distinction between squeezeback and overlay. While there may be other
  // content surrounding the player with the squeezeback, the player with the
  // squeezeback must be the focus of the user’s visit. It should remain the
  // primary content on the page and the primary video player in-view.
  VIDEO_PLCMT_SUBTYPE_SQUEEZEBACK = 8;
  // In-scene: A form of advertising that integrates branded elements directly
  // within the content itself, rather than appearing as separate pre-roll,
  // mid-roll, overlay, or display formats. In Scene Advertising is composited
  // into the video content and blends the brand naturally into the scene,
  // environment, or storyline, ensuring contextual relevance and viewer
  // immersion without interrupting the user experience. In-scene ads typically
  // consist of product placements or virtual out of A insertions. At this time,
  // the standardization focuses on the out of home insertions in non-live
  // content. While there may be other content surrounding the player with the
  // in-scene ad, the player with the in-scene ad must be the focus of the
  // user’s visit. It should remain the primary content on the page and the
  // primary video player in-view.
  VIDEO_PLCMT_SUBTYPE_IN_SCENE = 9;
}

