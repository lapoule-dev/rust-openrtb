// AdCOM 1.0 List: Native Data Asset Types. The following table is a list of
// common data asset types. This list is non-exhaustive and is intended to be
// expanded over time. Size recommendations are noted as "*maximum length of at
// least*", which means the publisher or supply platform should support a maximum
// length of at least this value and the buying platform knows that a string of
// this size should be accepted.
// 500+: Vendor-specific codes.
enum NativeDataAssetType {
  // Not in the spec: the zero value open enums require.
  NATIVE_DATA_ASSET_TYPE_UNSPECIFIED = 0;
  // sponsored: "Sponsored By" message which should contain the brand name of the
  // sponsor. Recommended maximum length of at least 25 characters.
  NATIVE_DATA_ASSET_TYPE_SPONSORED = 1;
  // desc: Descriptive text associated with the product or service being
  // advertised. Long text lengths may be truncated or ellipsed when rendered.
  // Recommended maximum length of at least 140 characters.
  NATIVE_DATA_ASSET_TYPE_DESC = 2;
  // rating: Numeric rating of the product (e.g., an app's rating). Recommended
  // integer range of 0-5.
  NATIVE_DATA_ASSET_TYPE_RATING = 3;
  // likes: Number of social ratings or "likes" of the product.
  NATIVE_DATA_ASSET_TYPE_LIKES = 4;
  // downloads: Number downloads and/or installs of the product.
  NATIVE_DATA_ASSET_TYPE_DOWNLOADS = 5;
  // price: Price of the product, app, or in-app purchase. Value should include
  // currency symbol in localized format (e.g., "$10").
  NATIVE_DATA_ASSET_TYPE_PRICE = 6;
  // saleprice: Sale price that can be used together with "price" to indicate a
  // comparative discounted price. Value should include currency symbol in
  // localized format (e.g., "$8.50").
  NATIVE_DATA_ASSET_TYPE_SALEPRICE = 7;
  // phone: A formatted phone number.
  NATIVE_DATA_ASSET_TYPE_PHONE = 8;
  // address: A formatted address.
  NATIVE_DATA_ASSET_TYPE_ADDRESS = 9;
  // desc2: Additional descriptive text associated with the product.
  NATIVE_DATA_ASSET_TYPE_DESC2 = 10;
  // displayurl: Display URL for the ad. To be used when sponsoring entity
  // doesn't own the content (e.g., "Sponsored by Brand on Site", where Site is
  // specified in this data asset).
  NATIVE_DATA_ASSET_TYPE_DISPLAYURL = 11;
  // ctatext: Description of the call to action (CTA) button for the destination
  // URL. Recommended maximum length of at least 15 characters.
  NATIVE_DATA_ASSET_TYPE_CTATEXT = 12;
}

