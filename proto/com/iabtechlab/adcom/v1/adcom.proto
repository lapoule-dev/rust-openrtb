// AdCOM 1.0 Object: AssetFormat. This object represents the permitted
// specifications of a single asset of a native ad. Along with its own
// attributes, exactly one of the asset subtype objects must be included. All
// others must be omitted.
message AssetFormat {

  // Asset ID, unique within the scope of this placement specification. REQUIRED
  // by the AdCOM specification.
  int32 id = 1;

  // Indicator of whether or not this asset is required, where 0 = no, 1 = yes.
  bool req = 2 [default = false];

  // Asset Format Subtype Object that indicates this is specifying a title asset
  // and provides additional detail as such. Refer to Object: TitleAssetFormat. *
  // Required if no other asset format subtype object is specified. REQUIRED by
  // the AdCOM specification.
  TitleAssetFormat title = 3;

  // Asset Format Subtype Object that indicates this is specifying an image asset
  // and provides additional detail as such. Refer to Object: ImageAssetFormat. *
  // Required if no other asset format subtype object is specified. REQUIRED by
  // the AdCOM specification.
  ImageAssetFormat img = 4;

  // Asset Format Subtype Object, which leverages the VideoPlacement object, that
  // indicates this is specifying a video asset and provides additional detail as
  // such. Refer to Object: VideoPlacement. * Required if no other asset format
  // subtype object is specified. REQUIRED by the AdCOM specification.
  VideoPlacement video = 5;

  // Asset Format Subtype Object that indicates this is specifying a data asset
  // and provides additional detail as such. Refer to Object: DataAssetFormat. *
  // Required if no other asset format subtype object is specified. REQUIRED by
  // the AdCOM specification.
  DataAssetFormat data = 6;

  // Optional vendor-specific extensions.
  Ext ext = 99;

  message Ext {
    extensions 500 to max;
  }
}

// AdCOM 1.0 Object: TitleAssetFormat. This object is used to provide native
// asset format specifications for a title element. Title elements are simple
// strings.
message TitleAssetFormat {

  // The maximum allowed length of the title value. Recommended lengths are 25,
  // 90, or 140. REQUIRED by the AdCOM specification.
  int32 len = 1;

  // Optional vendor-specific extensions.
  Ext ext = 99;

  message Ext {
    extensions 500 to max;
  }
}

// AdCOM 1.0 Object: ImageAssetFormat. This object is used to provide native
// asset format specifications for an image element. Image elements are typically
// used for the actual creative image and icons.
message ImageAssetFormat {

  // The type of image asset supported. Refer to List: Native Image Asset Types.
  com.iabtechlab.adcom.v1.enums.NativeImageAssetType type = 1;

  // Array of supported mime types (e.g., “image/jpeg”, “image/gif”). If
  // omitted, all types are assumed.
  repeated string mime = 2;

  // Absolute width of the image asset in device independent pixels (DIPS). Note
  // that mixing absolute and relative sizes is not recommended.
  int32 w = 3;

  // Absolute height of the image asset in device independent pixels (DIPS). Note
  // that mixing absolute and relative sizes is not recommended.
  int32 h = 4;

  // The minimum requested absolute width of the image in device independent
  // pixels (DIPS). This option should be used for any scaling of images by the
  // client.
  int32 wmin = 5;

  // The minimum requested absolute height of the image in device independent
  // pixels (DIPS). This option should be used for any scaling of images by the
  // client.
  int32 hmin = 6;

  // Relative width of the image asset when expressing size as a ratio. Note that
  // mixing absolute and relative sizes is not recommended.
  int32 wratio = 7;

  // Relative height of the image asset when expressing size as a ratio. Note
  // that mixing absolute and relative sizes is not recommended.
  int32 hratio = 8;

  // Optional vendor-specific extensions.
  Ext ext = 99;

  message Ext {
    extensions 500 to max;
  }
}

// AdCOM 1.0 Object: DataAssetFormat. This object is used to provide native asset
// format specifications for a data element. A data asset is used for all
// miscellaneous elements such as brand name, ratings, stars, review count,
// downloads, prices, etc. It is purposefully generic to support native elements
// not currently contemplated by this specification.
message DataAssetFormat {

  // The type of data asset supported. Refer to List: Native Data Asset Types.
  // REQUIRED by the AdCOM specification.
  com.iabtechlab.adcom.v1.enums.NativeDataAssetType type = 1;

  // The maximum allowed length of the data value.
  int32 len = 2;

  // Optional vendor-specific extensions.
  Ext ext = 99;

  message Ext {
    extensions 500 to max;
  }
}

// AdCOM 1.0 Object: EventSpec. This object specifies a type of ad tracking event
// and which methods of tracking are available for it. This object may appear as
// an array for a given placement indicating various types of available tracking
// events.
message EventSpec {

  // Type of supported ad tracking event. Refer to List: Event Types. REQUIRED by
  // the AdCOM specification.
  com.iabtechlab.adcom.v1.enums.EventType type = 1;

  // Array of supported event tracking methods for this event type. Refer to
  // List: Event Tracking Methods.
  repeated com.iabtechlab.adcom.v1.enums.EventTrackingMethod method = 2;

  // Event tracking APIs available for use; only relevant for JavaScript method
  // trackers. Refer to List: API Frameworks.
  repeated com.iabtechlab.adcom.v1.enums.ApiFramework api = 3;

  // Array of domains, top two levels only (e.g., “tracker.com”), that
  // constitute a restriction list of JavaScript trackers. The sense of the
  // restrictions is determined by wjs.
  repeated string jstrk = 4;

  // Sense of the jstrk restriction list, where 0 = block list, 1 = allow list.
  bool wjs = 5 [default = true];

  // Array of domains, top two levels only (e.g., “tracker.com”), that
  // constitute a restriction list of pixel image trackers. The sense of the
  // restrictions is determined by wpx.
  repeated string pxtrk = 6;

  // Sense of the pxtrk restriction list, where 0 = block list, 1 = allow list.
  bool wpx = 7 [default = true];

  // Optional vendor-specific extensions.
  Ext ext = 99;

  message Ext {
    extensions 500 to max;
  }
}

// AdCOM 1.0 Object: VideoPlacement. This object signals that the placement may
// be a video placement and provides additional detail about permitted video ads
// (e.g., VAST).
message VideoPlacement {

  // Placement subtype. Refer to List: Plcmt Subtypes - Video.
  com.iabtechlab.adcom.v1.enums.VideoPlcmtSubtype ptype = 1;

  // Placement position on screen. Refer to List: Placement Positions.
  com.iabtechlab.adcom.v1.enums.PlacementPosition pos = 2;

  // Indicates the start delay in seconds for pre-roll, mid-roll, or post-roll
  // placements. For additional generic values, refer to List: Start Delay Modes.
  int32 delay = 3;

  // Indicates if the placement imposes ad skippability, where 0 = no, 1 = yes.
  bool skip = 4;

  // The placement allows creatives of total duration greater than this number of
  // seconds to be skipped; only applicable if the ad is skippable.
  int32 skipmin = 5 [default = 0];

  // Number of seconds a creative must play before the placement enables
  // skipping; only applicable if the ad is skippable.
  int32 skipafter = 6 [default = 0];

  // Playback method(s) in use for this placement. Refer to List: Playback
  // Methods.
  repeated com.iabtechlab.adcom.v1.enums.PlaybackMethod playmethod = 7;

  // The event that causes playback to end for this placement. Refer to List:
  // Playback Cessation Modes.
  com.iabtechlab.adcom.v1.enums.PlaybackCessationMode playend = 8;

  // Indicates the click type of the placement. Refer to List: Click Types.
  com.iabtechlab.adcom.v1.enums.ClickType clktype = 9;

  // Array of supported mime types (e.g., “video/mp4”). If omitted, all types
  // are assumed. REQUIRED by the AdCOM specification.
  repeated string mime = 10;

  // List of supported APIs for this placement. If an API is not explicitly
  // listed, it is assumed to be unsupported. Refer to List: API Frameworks.
  repeated com.iabtechlab.adcom.v1.enums.ApiFramework api = 11;

  // Creative subtypes permitted for this placement. Refer to List: Creative
  // Subtypes - Audio/Video.
  repeated com.iabtechlab.adcom.v1.enums.CreativeSubtypeAudioVideo ctype = 12;

  // Width of the placement in units specified by unit.
  int32 w = 13;

  // Height of the placement in units specified by unit.
  int32 h = 14;

  // Units of size used for w and h attributes. Refer to List: Size Units.
  com.iabtechlab.adcom.v1.enums.SizeUnit unit = 15 [default = SIZE_UNIT_DIPS];

  // Minimum creative duration in seconds. This field is mutually exclusive with
  // rqddurs; only one of mindur and rqddurs may be in a bid request.
  int32 mindur = 16;

  // Maximum creative duration in seconds. This field is mutually exclusive with
  // rqddurs; only one of maxdur and rqddurs may be in a bid request.
  int32 maxdur = 17;

  // Precise acceptable durations for video creatives in seconds. This field
  // specifically targets the Live TV use case where non-exact ad durations would
  // result in undesirable 'dead air'. This field is mutually exclusive with
  // mindur and maxdur; if rqddurs is specified, mindur and maxdur must not be
  // specified and vice versa.
  repeated int32 rqddurs = 18;

  // Maximum extended creative duration if extension is allowed. If 0, extension
  // is not allowed. If -1, extension is allowed and there is no time limit
  // imposed. If greater than 0, then the value represents the number of seconds
  // of extended play supported beyond the maxdur value.
  int32 maxext = 19 [default = 0];

  // Minimum bit rate of the creative in Kbps.
  int32 minbitr = 20;

  // Maximum bit rate of the creative in Kbps.
  int32 maxbitr = 21;

  // Array of supported creative delivery methods. If omitted, all can be
  // assumed. Refer to List: Delivery Methods.
  repeated com.iabtechlab.adcom.v1.enums.DeliveryMethod delivery = 22;

  // The maximum number of ads that can be played in an ad pod.
  int32 maxseq = 23;

  // Indicates the total amount of time in seconds that advertisers may fill for
  // a “dynamic” video ad pod, or the dynamic portion of a “hybrid” ad
  // pod. This field is required only for the dynamic portion(s) of video ad
  // pods. This field refers to the length of the entire ad break, whereas
  // mindur/maxdur/rqddurs are constraints relating to the slots that make up the
  // pod.
  int32 poddur = 24;

  // Unique identifier indicating that an impression opportunity belongs to a
  // video ad pod. If multiple impression opportunities within a bid request
  // share the same podid, this indicates that those impression opportunities
  // belong to the same video ad pod.
  int32 podid = 25;

  // The sequence (position) of the video ad pod within a content stream. Refer
  // to List: List: Pod Sequence for guidance on the use of this field.
  com.iabtechlab.adcom.v1.enums.PodSequence podseq = 26 [default = POD_SEQUENCE_ANY];

  // For video ad pods, this value indicates that the seller can guarantee
  // delivery against the indicated slot position in the pod. Refer to List:
  // List: Slot Position in Pod for guidance on the use of this field.
  com.iabtechlab.adcom.v1.enums.SlotPositionInPod slotinpod = 27 [default = SLOT_POSITION_IN_POD_ANY];

  // Minimum CPM per second. This is a price floor for the “dynamic” portion
  // of a video ad pod, relative to the duration of bids an advertiser may
  // submit.
  double mincpmpersec = 28;

  // Indicates if the creative must be linear, nonlinear, etc. If none specified,
  // no restrictions are assumed. Refer to List: Linearity Modes. Note that this
  // field describes the expected VAST response and not whether a placement is
  // in-stream, out-stream, etc. For that, see ptype.
  com.iabtechlab.adcom.v1.enums.LinearityMode linear = 29;

  // Indicates if letterboxing of 4:3 creatives into a 16:9 window is allowed,
  // where 0 = no, 1 = yes.
  bool boxing = 30 [default = true];

  // Array of objects indicating that companion ads are available and providing
  // the specifications thereof. Refer to Object: Companion.
  repeated Companion comp = 31;

  // Supported companion ad types; recommended if companion ads are specified in
  // comp. Refer to List: Companion Types.
  repeated com.iabtechlab.adcom.v1.enums.CompanionType comptype = 32;

  // Directions in which the creative (video placement) is permitted to expand.
  // Refer to List: Expandable Directions.
  repeated com.iabtechlab.adcom.v1.enums.ExpandableDirection expdir = 33;

  // Directions in which the creative (video overlay) is permitted to expand.
  // This is primarily used for non-linear videos. Refer to List: Expandable
  // Directions.
  repeated com.iabtechlab.adcom.v1.enums.ExpandableDirection overlayexpdir = 34;
}

// AdCOM 1.0 Object: AudioPlacement. This object signals that the placement may
// be an audio placement and provides additional detail about permitted audio ads
// (e.g., DAAST).
message AudioPlacement {

  // Indicates the start delay in seconds for pre-roll, mid-roll, or post-roll
  // placements. For additional generic values, refer to List: Start Delay Modes.
  int32 delay = 1;

  // Indicates if the placement imposes ad skippability, where 0 = no, 1 = yes.
  bool skip = 2;

  // The placement allows creatives of total duration greater than this number of
  // seconds to be skipped; only applicable if the ad is skippable.
  int32 skipmin = 3 [default = 0];

  // Number of seconds a creative must play before the placement enables
  // skipping; only applicable if the ad is skippable.
  int32 skipafter = 4 [default = 0];

  // Playback method(s) in use for this placement. Refer to List: Playback
  // Methods.
  repeated com.iabtechlab.adcom.v1.enums.PlaybackMethod playmethod = 5;

  // The event that causes playback to end for this placement. Refer to List:
  // Playback Cessation Modes.
  com.iabtechlab.adcom.v1.enums.PlaybackCessationMode playend = 6;

  // Type of audio feed of this placement. Refer to List: Feed Types.
  com.iabtechlab.adcom.v1.enums.FeedType feed = 7;

  // Volume normalization mode of this placement. Refer to List: Volume
  // Normalization Modes.
  com.iabtechlab.adcom.v1.enums.VolumeNormalizationMode nvol = 8;

  // Array of supported mime types (e.g., “audio/mp4”). If omitted, all types
  // are assumed. REQUIRED by the AdCOM specification.
  repeated string mime = 9;

  // List of supported APIs for this placement. If an API is not explicitly
  // listed, it is assumed to be unsupported. Refer to List: API Frameworks.
  repeated com.iabtechlab.adcom.v1.enums.ApiFramework api = 10;

  // Creative subtypes permitted for this placement. Refer to List: Creative
  // Subtypes - Audio/Video.
  repeated com.iabtechlab.adcom.v1.enums.CreativeSubtypeAudioVideo ctype = 11;

  // Minimum creative duration in seconds. This field is mutually exclusive with
  // rqddurs; only one of mindur and rqddurs may be in a bid request.
  int32 mindur = 12;

  // Maximum creative duration in seconds. This field is mutually exclusive with
  // rqddurs; only one of maxdur and rqddurs may be in a bid request.
  int32 maxdur = 13;

  // Precise acceptable durations for video creatives in seconds. This field
  // specifically targets the Live TV use case where non-exact ad durations would
  // result in undesirable 'dead air'. This field is mutually exclusive with
  // mindur and maxdur; if rqddurs is specified, mindur and maxdur must not be
  // specified and vice versa.
  repeated int32 rqddurs = 14;

  // Maximum extended creative duration if extension is allowed. If 0, extension
  // is not allowed. If -1, extension is allowed and there is no time limit
  // imposed. If greater than 0, then the value represents the number of seconds
  // of extended play supported beyond the maxdur value.
  int32 maxext = 15;

  // Minimum bit rate of the creative in Kbps.
  int32 minbitr = 16;

  // Maximum bit rate of the creative in Kbps.
  int32 maxbitr = 17;

  // Array of supported creative delivery methods. If omitted, all can be
  // assumed. Refer to List: Delivery Methods.
  repeated com.iabtechlab.adcom.v1.enums.DeliveryMethod delivery = 18;

  // The maximum number of ads that can be played in an ad pod.
  int32 maxseq = 19;

  // Indicates the total amount of time in seconds that advertisers may fill for
  // a “dynamic” video ad pod, or the dynamic portion of a “hybrid” ad
  // pod. This field is required only for the dynamic portion(s) of video ad
  // pods. This field refers to the length of the entire ad break, whereas
  // mindur/maxdur/rqddurs are constraints relating to the slots that make up the
  // pod.
  int32 poddur = 20;

  // Unique identifier indicating that an impression opportunity belongs to a
  // video ad pod. If multiple impression opportunities within a bid request
  // share the same podid, this indicates that those impression opportunities
  // belong to the same video ad pod.
  int32 podid = 21;

  // The sequence (position) of the video ad pod within a content stream. Refer
  // to List: List: Pod Sequence for guidance on the use of this field.
  com.iabtechlab.adcom.v1.enums.PodSequence podseq = 22 [default = POD_SEQUENCE_ANY];

  // For video ad pods, this value indicates that the seller can guarantee
  // delivery against the indicated slot position in the pod. Refer to List:
  // List: Slot Position in Pod for guidance on the use of this field.
  com.iabtechlab.adcom.v1.enums.SlotPositionInPod slotinpod = 23 [default = SLOT_POSITION_IN_POD_ANY];

  // Minimum CPM per second. This is a price floor for the “dynamic” portion
  // of a video ad pod, relative to the duration of bids an advertiser may
  // submit.
  double mincpmpersec = 24;

  // Array of objects indicating that companion ads are available and providing
  // the specifications thereof. Refer to Object: Companion.
  repeated Companion comp = 25;

  // Supported companion ad types; recommended if companion ads are specified in
  // comp. Refer to List: Companion Types.
  repeated com.iabtechlab.adcom.v1.enums.CompanionType comptype = 26;

  // Directions in which the creative (overlay) is permitted to expand. Refer to
  // List: Expandable Directions.
  repeated com.iabtechlab.adcom.v1.enums.ExpandableDirection overlayexpdir = 27;

  // Optional vendor-specific extensions.
  Ext ext = 99;

  message Ext {
    extensions 500 to max;
  }
}

// AdCOM 1.0 Object: Companion. This object is used in video and audio placements
// to specify an associated or so-called *companion* display ad. Video and audio
// placements can specify an array of companion ads.
message Companion {

  // Identifier of the companion ad; unique within this placement.
  string id = 1;

  // Indicates the companion ad rendering mode relative to the associated video
  // or audio ad, where 0 = concurrent, 1 = end-card. For a given placement,
  // typically only one companion at most should be designated as an end card.
  bool vcm = 2;

  // Display specification object representing the companion ad. Refer to Object:
  // DisplayPlacement.
  DisplayPlacement display = 3;

  // Optional vendor-specific extensions.
  Ext ext = 99;

  message Ext {
    extensions 500 to max;
  }
}

// AdCOM 1.0 Object: Site. This object is used to define an ad supported website,
// in contrast to a non-browser application, for example. As a derived class, a
// Site object inherits all DistributionChannel attributes and adds those defined
// below.
message Site {

  // Vendor-specific unique identifier of the distribution channel. RECOMMENDED
  // by the AdCOM specification.
  string id = 1;

  // Displayable name of the distribution channel.
  string name = 2;

  // Details about the publisher of the distribution channel. Refer to Object:
  // Publisher.
  Publisher pub = 3;

  // Details about the content within the distribution channel. Refer to Object:
  // Content.
  Content content = 4;

  // Domain of the site (e.g., “mysite.foo.com”).
  string domain = 5;

  // Array of content categories describing the site using IDs from the taxonomy
  // indicated in cattax.
  repeated string cat = 6;

  // Array of content categories describing the current section of the site using
  // IDs from the taxonomy indicated in cattax.
  repeated string sectcat = 7;

  // Array of content categories describing the current page or view of the site
  // using IDs from the taxonomy indicated in cattax.
  repeated string pagecat = 8;

  // The taxonomy in use for the cat, sectcat and pagecat attributes. Refer to
  // List: Category Taxonomies.
  com.iabtechlab.adcom.v1.enums.CategoryTaxonomy cattax = 9;

  // Indicates if the site has a privacy policy, where 0 = no, 1 = yes.
  bool privpolicy = 10;

  // This field is deprecated, use 'kwarray' instead.
  string keywords = 11;

  // Array of keywords about the site. Only one of 'keywords' or 'kwarray' may be
  // present.
  repeated string kwarray = 12;

  // URL of the page within the site.
  string page = 13;

  // Referrer URL that caused navigation to the current page.
  string ref = 14;

  // Search string that caused navigation to the current page.
  string search = 15;

  // Indicates if the site has been programmed to optimize layout when viewed on
  // mobile devices, where 0 = no, 1 = yes.
  bool mobile = 16;

  // Indicates if the page is built with AMP HTML, where 0 = no, 1 = yes.
  bool amp = 17;

  // Optional vendor-specific extensions.
  Ext ext = 99;

  message Ext {
    extensions 500 to max;
  }
}

// AdCOM 1.0 Object: App. This object is used to define an ad supported
// non-browser application, in contrast to a typical website, example. As a
// derived class, an App object inherits all DistributionChannel attributes and
// adds those defined below.
message App {

  // Vendor-specific unique identifier of the distribution channel. RECOMMENDED
  // by the AdCOM specification.
  string id = 1;

  // Displayable name of the distribution channel.
  string name = 2;

  // Details about the publisher of the distribution channel. Refer to Object:
  // Publisher.
  Publisher pub = 3;

  // Details about the content within the distribution channel. Refer to Object:
  // Content.
  Content content = 4;

  // Domain of the app (e.g., “mygame.foo.com”).
  string domain = 5;

  // Array of content categories describing the app using IDs from the taxonomy
  // indicated in cattax.
  repeated string cat = 6;

  // Array of content categories describing the current section of the app using
  // IDs from the taxonomy indicated in cattax.
  repeated string sectcat = 7;

  // Array of content categories describing the current page or view of the app
  // using IDs from the taxonomy indicated in cattax.
  repeated string pagecat = 8;

  // The taxonomy in use for the cat, sectcat and pagecat attributes. Refer to
  // List: Category Taxonomies.
  com.iabtechlab.adcom.v1.enums.CategoryTaxonomy cattax = 9;

  // Indicates if the app has a privacy policy, where 0 = no, 1 = yes.
  bool privpolicy = 10;

  // This field is deprecated, use 'kwarray' instead.
  string keywords = 11;

  // Array of keywords about the app. Only one of 'keywords' or 'kwarray' may be
  // present.
  repeated string kwarray = 12;

  // Bundle or package name of the app (e.g., “com.foo.mygame”) and should
  // NOT be app store IDs (e.g., not iTunes store IDs).
  string bundle = 13;

  // The ID of the app in an app store (e.g., Apple iTunes, Google Play).
  string storeid = 14;

  // App store URL for an installed app; for IQG 2.1 compliance.
  string storeurl = 15;

  // Application version.
  string ver = 16;

  // Indicator of whether or not this is a paid app, where 0 = free, 1 = paid.
  bool paid = 17 [default = false];

  // Optional vendor-specific extensions.
  Ext ext = 99;

  message Ext {
    extensions 500 to max;
  }
}

// AdCOM 1.0 Object: Dooh. This object is used to define an ad supported digital
// out-of-home (DOOH) experience such as a public kiosk or digital billboard. As
// a derived class, a Dooh object inherits all DistributionChannel attributes and
// adds those defined below.
message Dooh {

  // Vendor-specific unique identifier of the distribution channel. RECOMMENDED
  // by the AdCOM specification.
  string id = 1;

  // Displayable name of the distribution channel.
  string name = 2;

  // Details about the publisher of the distribution channel. Refer to Object:
  // Publisher.
  Publisher pub = 3;

  // Details about the content within the distribution channel. Refer to Object:
  // Content.
  Content content = 4;

  // The type of out-of-home venue. Refer to List: DOOH Venue TypesList: DOOH
  // Venue Types.
  com.iabtechlab.adcom.v1.enums.DoohVenueType venue = 5;

  // Indicates whether the DOOH placement is in a fixed location (e.g., kiosk,
  // billboard, elevator) or is movable (e.g., taxi), where 1 = fixed, 2 =
  // movable.
  int32 fixed = 6;

  // The exposure time in seconds per view that the creative will be displayed
  // before refreshing to the next creative.
  int32 etime = 7;

  // Minimum DPI for text-based creative elements to display clearly.
  int32 dpi = 8;

  // Optional vendor-specific extensions.
  Ext ext = 99;

  message Ext {
    extensions 500 to max;
  }
}

// AdCOM 1.0 Object: Publisher. This object describes the publisher of the media
// in which ads will be displayed.
message Publisher {

  // Vendor-specific unique publisher identifier, as used in ads.txt files.
  // RECOMMENDED by the AdCOM specification.
  string id = 1;

  // Displayable name of the publisher.
  string name = 2;

  // Highest level domain of the publisher (e.g., “publisher.com”).
  string domain = 3;

  // Array of content categories that describe the publisher using IDs from the
  // taxonomy indicated in cattax. Implementer should ensure compliance with
  // regional legislation around data usage and sharing.
  repeated string cat = 4;

  // The taxonomy in use for the cat attribute. Refer to
  // ![image](https://github.com/InteractiveAdvertisingBureau/AdCOM/assets/114763292/e80e72e1-e099-4aff-b466-a5e91eb9f62f).
  com.iabtechlab.adcom.v1.enums.CategoryTaxonomy cattax = 5;

  // Optional vendor-specific extensions.
  Ext ext = 99;

  message Ext {
    extensions 500 to max;
  }
}

// AdCOM 1.0 Object: Content. This object describes the content in which an
// impression can appear, which may be syndicated or non-syndicated content. This
// object may be useful when syndicated content contains impressions and does not
// necessarily match the publisher's general content. An exchange may or may not
// have knowledge of the page where the content is running as a result of the
// syndication method (e.g., a video impression embedded in an iframe on an
// unknown web property or device).
message Content {

  // Publisher-provided ID uniquely identifying the content.
  string id = 1;

  // Episode number.
  int32 episode = 2;

  // Content title. *Video Examples:* “Search Committee” (television), “A
  // New Hope” (movie), or “Endgame” (made for web). *Non-Video Example:*
  // “Why an Antarctic Glacier Is Melting So Quickly” (Time magazine
  // article).
  string title = 3;

  // Content series. *Video Examples:* “The Office” (television), “Star
  // Wars” (movie), or “Arby ‘N’ The Chief” (made for web). *Non-Video
  // Example:* “Ecocentric” (Time Magazine blog).
  string series = 4;

  // Content season (e.g., “Season 3”).
  string season = 5;

  // Artist credited with the content.
  string artist = 6;

  // Genre that best describes the content (e.g., rock, pop, etc).
  string genre = 7;

  // Unique ID(s) for the genre of the content as listed in the taxonomy defined
  // by the gtax field. If no gtax field is supplied, subset of rows listed in
  // [CTV Genre
  // Mapping](https://github.com/InteractiveAdvertisingBureau/Taxonomies/blob/main/Taxonomy%20Mappings/CTV%20Genre%20Mapping.tsv)
  // of [Content Category Taxonomy
  // 3.1](https://github.com/InteractiveAdvertisingBureau/Taxonomies/blob/main/Content%20Taxonomies/Content%20Taxonomy%203.1.tsv)
  // are assumed. See [Section 7.13 of Implementation
  // Guidance](implementation.md#genre) for additional detail.
  repeated string genres = 8;

  // The taxonomy in use. Refer to list [List: Category
  // Taxonomies](https://github.com/InteractiveAdvertisingBureau/AdCOM/blob/master/AdCOM%20v1.0%20FINAL.md#list_categorytaxonomies)
  // in AdCOM 1.0 for values. If no gtax field is supplied rows listed, Content
  // Category Taxonomy 3.1 is assumed
  com.iabtechlab.adcom.v1.enums.CategoryTaxonomy gtax = 9 [default = CATEGORY_TAXONOMY_CONTENT_3_1];

  // Album to which the content belongs; typically for audio.
  string album = 10;

  // International Standard Recording Code conforming to ISO- 3901.
  string isrc = 11;

  // URL of the content, for buy-side contextualization or review.
  string url = 12;

  // Array of IAB Tech Lab content categories that describe the content. The
  // taxonomy to be used is defined by the cattax field. If no cattax field is
  // supplied Content Category Taxonomy 1.0 is assumed.
  repeated string cat = 13;

  // The taxonomy in use. Refer to list [List: Category
  // Taxonomies](https://github.com/InteractiveAdvertisingBureau/AdCOM/blob/master/AdCOM%20v1.0%20FINAL.md#list_categorytaxonomies)
  // in AdCOM 1.0 for values.
  com.iabtechlab.adcom.v1.enums.CategoryTaxonomy cattax = 14 [default = CATEGORY_TAXONOMY_CONTENT_CATEGORY_1_0];

  // Production quality. Refer to [List: Production
  // Qualities](https://github.com/InteractiveAdvertisingBureau/AdCOM/blob/master/AdCOM%20v1.0%20FINAL.md#list--production-qualities-)
  // in AdCOM 1.0.
  com.iabtechlab.adcom.v1.enums.ProductionQuality prodq = 15;

  // Type of content (game, video, text, etc.). Refer to [List: Content
  // Contexts](https://github.com/InteractiveAdvertisingBureau/AdCOM/blob/master/AdCOM%20v1.0%20FINAL.md#list--content-contexts-)
  // in AdCOM 1.0.
  com.iabtechlab.adcom.v1.enums.ContentContext context = 16;

  // Content rating (e.g., MPAA).
  string rating = 17;

  // User rating of the content (e.g., number of stars, likes, etc.).
  string urating = 18;

  // Media rating per IQG guidelines. Refer to [List: Media
  // Ratings](https://github.com/InteractiveAdvertisingBureau/AdCOM/blob/master/AdCOM%20v1.0%20FINAL.md#list--media-ratings-)
  // in AdCOM 1.0.
  com.iabtechlab.adcom.v1.enums.MediaRating mrating = 19;

  // Comma separated list of keywords describing the content. Only one of
  // `keywords` or `kwarray` may be present.
  string keywords = 20;

  // Array of keywords about the site. Only one of `keywords` or `kwarray` may be
  // present.
  repeated string kwarray = 21;

  // An enumeration indicating the method of broadcast of the content where: 0 =
  // the broadcast is not scheduled (e.g. it is VOD or otherwise user initiated).
  // 1 = the broadcast is scheduled (also referred to as linear viewing).
  int32 live = 22;

  // 0 = indirect, 1 = direct.
  int32 srcrel = 23;

  // Length of content in seconds; appropriate for video or audio.
  int32 len = 24;

  // Content language using ISO-639-1-alpha-2. Only one of `lang` or `langb`
  // should be present.
  string lang = 25;

  // Content language using IETF BCP 47. Only one of `lang` or `langb` should be
  // present.
  string langb = 26;

  // Indicator of whether the content is embeddable (e.g., an embeddable video
  // player), where 0 = no, 1 = yes.
  bool embed = 27;

  // Details about the content `Producer` (Section 3.2.17).
  Producer producer = 28;

  // Details about the network (Section 3.2.23) the content is on.
  Network network = 29;

  // Details about the channel (Section 3.2.24) the content is on.
  Channel channel = 30;

  // Additional content data. Each `Data` object (Section 3.2.21) represents a
  // different data source.
  repeated Data data = 31;

  // An enumeration indicating if the event is happening in real time while it is
  // being watched where: 0 = not happening in real time (e.g., a replay). 1 =
  // yes, happening in real time (e.g., a live sports game).
  bool realtime = 32;

  // An enumeration indicating whether this broadcast is the first time the
  // content is available to an audience where: 0 = not first time being
  // broadcast 1 = first time being broadcast
  int32 firstbroadcast = 33;

  // Optional vendor-specific extensions.
  Ext ext = 99;

  message Ext {
    extensions 500 to max;
  }
}

// AdCOM 1.0 Object: Producer. This object defines the producer of the content in
// which ad will be displayed. This is particularly useful when the content is
// syndicated and may be distributed through different publishers and thus when
// the producer and publisher are not necessarily the same entity.
message Producer {

  // Vendor-specific unique producer identifier. Useful if content is syndicated
  // and may be posted on a site using embed tags. RECOMMENDED by the AdCOM
  // specification.
  string id = 1;

  // Displayable name of the producer.
  string name = 2;

  // Highest level domain of the producer (e.g., “producer.com”).
  string domain = 3;

  // Array of content categories that describe the producer using IDs from the
  // taxonomy indicated in cattax.
  repeated string cat = 4;

  // The taxonomy in use for the cat attribute. Refer to List: Category
  // Taxonomies.
  com.iabtechlab.adcom.v1.enums.CategoryTaxonomy cattax = 5;

  // Optional vendor-specific extensions.
  Ext ext = 99;

  message Ext {
    extensions 500 to max;
  }
}

// AdCOM 1.0 Object: Network. This object describes the network an ad will be
// displayed on. A Network is defined as the parent entity of the Channel
// object’s entity for the purposes of organizing Channels. Examples are
// companies that own and/or license a collection of content channels (Viacom,
// Discovery, CBS, WarnerMedia, Turner and others), or studio that creates such
// content and self-distributes content. Name is human-readable field while
// domain and id can be used for reporting and targeting purposes.
message Network {

  // A unique identifier assigned by the publisher. This may not be a unique
  // identifier across all supply sources.
  string id = 1;

  // Network the content is on (e.g., a TV network like "ABC").
  string name = 2;

  // The primary domain of the network (e.g., “abc.com” in the case of the
  // network ABC). It is recommended to include the top private domain (PSL+1)
  // for DSP targeting normalization purposes.
  string domain = 3;

  // Optional vendor-specific extensions.
  Ext ext = 99;

  message Ext {
    extensions 500 to max;
  }
}

// AdCOM 1.0 Object: Channel. This object describes the channel an ad will be
// displayed on. A Channel is defined as the entity that curates a content
// library, or stream within a brand name for viewers. Examples are specific view
// selectable ‘channels’ within linear and streaming television (MTV, HGTV,
// CNN, BBC One, etc) or a specific stream of audio content commonly called
// ‘stations.’ Name is human-readable field while domain and id can be used
// for reporting and targeting purposes.
message Channel {

  // A unique identifier assigned by the publisher. This may not be a unique
  // identifier across all supply sources.
  string id = 1;

  // Channel the content is on (e.g., a local channel like "WABC-TV").
  string name = 2;

  // The primary domain of the channel (e.g., “abc7ny.com” in the case of the
  // local channel WABC-TV). It is recommended to include the top private domain
  // (PSL+1) for DSP targeting normalization purposes.
  string domain = 3;

  // Optional vendor-specific extensions.
  Ext ext = 99;

  message Ext {
    extensions 500 to max;
  }
}

// AdCOM 1.0 Object: User. This object contains information known or derived
// about the human user of the device (i.e., the audience for advertising). The
// user ID is a vendor-specific artifact and may be subject to rotation or other
// privacy policies. However, this user ID must be stable long enough to serve
// reasonably as the basis for frequency capping and retargeting. Implementer
// should ensure compliance with regional legislation around data usage and
// sharing.
message User {

  // Exchange-specific ID for the user At least one of id or buyeruid is strongly
  // recommended. Unless prior arrangements have been made between the buyer and
  // the seller directly, the value in this field is expected to be derived from
  // an ID sync. (see [Appendix: Cookie Based ID
  // Syncing)](https://github.com/InteractiveAdvertisingBureau/openrtb2.x/blob/main/2.6.md#appendixc)
  // RECOMMENDED by the AdCOM specification.
  string id = 1;

  // Buyer-specific ID for the user as mapped by an exchange for the buyer. At
  // least one of id or buyeruid is strongly recommended. Unless prior
  // arrangements have been made between the buyer and the seller directly, the
  // value in this field is expected to be derived from an ID sync. (see
  // [Appendix: Cookie Based ID
  // Syncing)](https://github.com/InteractiveAdvertisingBureau/openrtb2.x/blob/main/2.6.md#appendixc)
  // RECOMMENDED by the AdCOM specification.
  string buyeruid = 2;

  // Deprecated as of OpenRTB 2.6
  int32 yob = 3 [deprecated = true];

  // Deprecated as of OpenRTB 2.6
  string gender = 4 [deprecated = true];

  // This field is deprecated, use 'kwarray' instead.
  string keywords = 5;

  // Array of keywords describing the content. Only one of 'keywords' or
  // 'kwarray' may be present.
  repeated string kwarray = 6;

  // GDPR consent string if applicable, complying with the comply with the IAB
  // standard Consent String Format in the Transparency and Consent Framework
  // technical specifications.
  string consent = 7;

  // Location of the user's home base (i.e., not necessarily their current
  // location). Refer to Object: Geo.
  Geo geo = 8;

  // Additional user data. Each Data object represents a different data source.
  // Refer to Object: Data.
  repeated Data data = 9;

  // Extended (third-party) identifiers for this user. Refer to Object: Extended
  // Identifiers.
  repeated Eid eids = 10;

  // Optional vendor-specific extensions.
  Ext ext = 99;

  message Ext {
    extensions 500 to max;
  }
}

// AdCOM 1.0 Object: Device. This object provides information pertaining to the
// device through which the user is interacting. Device information includes its
// hardware, platform, location, and carrier data. The device can refer to a
// mobile handset, a desktop computer, set top box, or other digital device.
// Implementer should ensure compliance with regional legislation around data
// usage and sharing.
message Device {

  // The general type of device. Refer to List: Device Types.
  com.iabtechlab.adcom.v1.enums.DeviceType type = 1;

  // Browser user agent string. This field represents a raw user agent string
  // from the browser. For backwards compatibility, exchanges are recommended to
  // always populate `ua` with the User-Agent string, when available from the end
  // user’s device, even if an alternative representation, such as the
  // User-Agent Client-Hints, is available and gets used to populate `sua`. No
  // inferred or approximated user agents are expected in this field. If both
  // `ua` and `sua` are present in the bid request, `sua` should be considered
  // the more accurate representation of the device attributes. This is because
  // the `ua` may contain a frozen or reduced UserAgent string.
  string ua = 2;

  // Structured user agent information defined by a Object: UserAgent. If both
  // `ua` and `sua` are present in the bid request, `sua` should be considered
  // the more accurate representation of the device attributes. This is because
  // the `ua` may contain a frozen or reduced UserAgent string.
  UserAgent sua = 3;

  // ID sanctioned for advertiser use in the clear (i.e., not hashed).
  string ifa = 4;

  // Standard “Do Not Track” flag as set in the header by the browser, where
  // 0 = tracking is unrestricted, 1 = do not track.
  bool dnt = 5;

  // “Limit Ad Tracking” signal commercially endorsed (e.g., iOS, Android),
  // where 0 = tracking is unrestricted, 1 = tracking must be limited per
  // commercial guidelines.
  bool lmt = 6;

  // Device make (e.g., "Apple").
  string make = 7;

  // Device model (e.g., “iPhone10,1” when the specific device model is
  // known, “iPhone” otherwise). The value obtained from the device O/S
  // should be used when available.
  string model = 8;

  // Device operating system. Refer to List: Operating Systems.
  com.iabtechlab.adcom.v1.enums.OperatingSystem os = 9;

  // Device operating system version (e.g., “3.1.2”).
  string osv = 10;

  // Hardware version of the device (e.g., “5S” for iPhone 5S).
  string hwv = 11;

  // Physical height of the screen in pixels.
  int32 h = 12;

  // Physical width of the screen in pixels.
  int32 w = 13;

  // Screen size as pixels per linear inch.
  int32 ppi = 14;

  // The ratio of physical pixels to device independent pixels.
  double pxratio = 15;

  // Support for JavaScript, where 0 = no, 1 = yes.
  bool js = 16;

  // Browser language using ISO-639-1-alpha-2. Only one of lang or langb should
  // be present.
  string lang = 17;

  // Browser language using IETF BCP 47. Only one of lang or langb should be
  // present.
  string langb = 18;

  // IPv4 address closest to device.
  string ip = 19;

  // IP address closest to device as IPv6.
  string ipv6 = 20;

  // The value of the “x-forwarded-for” header.
  string xff = 21;

  // Indicator of truncation of any of the IP attributes (i.e., ip, ipv6, xff),
  // where 0 = no, 1 = yes (e.g., from 1.2.3.4 to 1.2.3.0). Refer to
  // https://tools.ietf.org/html/rfc6235#section-4.1.1 for more information on IP
  // truncation.
  bool iptr = 22;

  // Carrier or ISP (e.g., “VERIZON”) using exchange curated string names
  // which should be published to bidders beforehand.
  string carrier = 23;

  // Mobile carrier as the concatenated MCC-MNC code (e.g., “310-005”
  // identifies Verizon Wireless CDMA in the USA). Refer to
  // https://en.wikipedia.org/wiki/Mobile_country_code for further information
  // and references. Note that the dash between the MCC and MNC parts is required
  // to remove parsing ambiguity. The MCC-MNC values represent the SIM installed
  // on the device and do not change when a device is roaming. Roaming may be
  // inferred by a combination of the MCC-MNC, geo, IP and other data signals.
  string mccmnc = 24;

  // MCC and MNC of the SIM card using the same format as mccmnc. When both
  // values are available, a difference between them reveals that a user is
  // roaming.
  string mccmncsim = 25;

  // Network connection type. Refer to List: Connection Types.
  com.iabtechlab.adcom.v1.enums.ConnectionType contype = 26;

  // Indicates if the geolocation API will be available to JavaScript code
  // running in display ad, where 0 = no, 1 = yes.
  bool geofetch = 27;

  // Location of the device (i.e., typically the user's current location). Refer
  // to Object: Geo.
  Geo geo = 28;

  // Optional vendor-specific extensions.
  Ext ext = 99;

  message Ext {
    extensions 500 to max;
  }
}

// AdCOM 1.0 Object: UserAgent. Structured user agent information provided when
// client supports User-Agent Client Hints. If both device.ua and device.sua are
// present in the bid request, device.sua should be considered the more accurate
// representation of the device attributes. This is because the device.ua may
// contain a frozen or reduced UserAgent string.
message UserAgent {

  // Each BrandVersion object identifies a browser or similar software component.
  // Refer to Object: BrandVersion. Implementers should send brands and versions
  // derived from the Sec-CH-UA-Full-Version-List header*. RECOMMENDED by the
  // AdCOM specification.
  repeated BrandVersion browsers = 1;

  // Refer to Object: BrandVersion that identifies the user agent’s execution
  // platform / OS. Implementers should send a brand derived from the
  // Sec-CH-UA-Platform header, and version derived from the
  // Sec-CH-UA-Platform-Version header *. RECOMMENDED by the AdCOM specification.
  BrandVersion platform = 2;

  // 1 if the agent prefers a “mobile” version of the content, if available,
  // i.e. optimized for small screens or touch input. 0 if the agent prefers the
  // “desktop” or “full” content. Implementers should derive this value
  // from the Sec-CH-UA-Mobile header *.
  int32 mobile = 3;

  // Device’s major binary architecture, e.g. “x86” or “arm”.
  // Implementers should retrieve this value from the Sec-CH-UA-Arch header*.
  string architecture = 4;

  // Device’s bitness, e.g. “64” for 64-bit architecture. Implementers
  // should retrieve this value from the Sec-CH-UA-Bitness header *.
  string bitness = 5;

  // Device model. Implementers should retrieve this value from the
  // Sec-CH-UA-Model header *.
  string model = 6;

  // The source of data used to create this object. Refer to List: User-Agent
  // Source
  com.iabtechlab.adcom.v1.enums.UserAgentSource source = 7 [default = USER_AGENT_SOURCE_UNSPECIFIED_UNKNOWN];

  // Optional vendor-specific extensions.
  Ext ext = 99;

  message Ext {
    extensions 500 to max;
  }
}

// AdCOM 1.0 Object: BrandVersion. Further identification based on User-Agent
// Client Hints, the BrandVersion object is used to identify a device’s browser
// or similar software component, and the user agent’s execution platform or
// operating system.
message BrandVersion {

  // A brand identifier, for example, “Chrome” or “Windows”. The value
  // may be sourced from the User-Agent Client Hints headers, representing either
  // the user agent brand (from the Sec-CH-UA-Full-Version header) or the
  // platform brand (from the Sec-CH-UA-Platform header). RECOMMENDED by the
  // AdCOM specification.
  string brand = 1;

  // A sequence of version components, in descending hierarchical order (major,
  // minor, micro, …)
  repeated string version = 2;

  // Optional vendor-specific extensions.
  Ext ext = 99;

  message Ext {
    extensions 500 to max;
  }
}

// AdCOM 1.0 Object: Geo. This object encapsulates various methods for specifying
// a geographic location. When subordinate to a Device object, it indicates the
// location of the device which can also be interpreted as the user's current
// location. When subordinate to a User object, it indicates the location of the
// user's home base (i.e., not necessarily their current location). The lat and
// lon attributes should only be passed if they conform to the accuracy depicted
// in the type attribute. For example, the centroid of a large region (e.g.,
// postal code) should not be passed.
message Geo {

  // Source of location data; recommended when passing lat/lon. Refer to List:
  // Location Types.
  com.iabtechlab.adcom.v1.enums.LocationType type = 1;

  // Latitude from -90.0 to +90.0, where negative is south.
  double lat = 2;

  // Longitude from -180.0 to +180.0, where negative is west.
  double lon = 3;

  // Estimated location accuracy in meters; recommended when lat/lon are
  // specified and derived from a device's location services (i.e., type = 1).
  // Note that this is the accuracy as reported from the device. Consult OS
  // specific documentation (e.g., Android, iOS) for exact interpretation.
  int32 accur = 4;

  // Number of seconds since this geolocation fix was established. Note that
  // devices may cache location data across multiple fetches. Ideally, this value
  // should be from the time the actual fix was taken.
  int32 lastfix = 5;

  // Service or provider used to determine geolocation from IP address if
  // applicable (i.e., type = 2). Refer to List: IP Location Services.
  com.iabtechlab.adcom.v1.enums.LocationService ipserv = 6;

  // Country code using ISO-3166-1-alpha-2. Note that alpha-3 codes may be
  // encountered and vendors are encouraged to be tolerant of them.
  string country = 7;

  // Region code using ISO-3166-2; 2-letter state code if USA.
  string region = 8;

  // Regional marketing areas such as Nielsen's DMA codes or other similar
  // taxonomy to be agreed among vendors prior to use. Note that DMA is a
  // trademarked asset of The Nielsen Company. Vendors are encouraged to ensure
  // their use of DMAs is properly licensed.
  string metro = 9;

  // City using United Nations Code for Trade & Transport Locations
  // “UN/LOCODE” with the space between country and city suppressed (e.g.,
  // Boston MA, USA = “USBOS”). Refer to UN/LOCODE Code List.
  string city = 10;

  // ZIP or postal code.
  string zip = 11;

  // Local time as the number +/- of minutes from UTC.
  int32 utcoffset = 12;

  // Optional vendor-specific extensions.
  Ext ext = 99;

  message Ext {
    extensions 500 to max;
  }
}

// AdCOM 1.0 Object: Data. The data and segment objects together allow additional
// data about the related object (e.g., user, content) to be specified. This data
// may be from multiple sources whether from the exchange itself or third parties
// as specified by the id attribute. When in use, vendor-specific IDs should be
// discussed beforehand among the parties. Implementer should ensure compliance
// with regional legislation around data usage and sharing.
message Data {

  // Vendor-specific ID for the data provider.
  string id = 1;

  // Vendor-specific displayable name for the data provider.
  string name = 2;

  // An array of Extended Content IDs, representing one or more identifiers for
  // the video or audio content from the ID source specified in the name field of
  // the data object.
  repeated string cids = 3;

  // Array of Segment objects that contain the actual data values. Refer to
  // Object: Segment.
  repeated Segment segment = 4;

  // Optional vendor-specific extensions.
  Ext ext = 99;

  message Ext {
    extensions 500 to max;
  }
}

// AdCOM 1.0 Object: Segment. Segment objects are essentially key-value pairs
// that convey specific units of data. The parent Data object is a collection of
// such values from a given data provider. When in use, vendor-specific IDs
// should be discussed beforehand among the parties.
message Segment {

  // ID of the data segment specific to the data provider.
  string id = 1;

  // Displayable name of the data segment specific to the data provider.
  string name = 2;

  // String representation of the data segment value.
  string value = 3;

  // Optional vendor-specific extensions.
  Ext ext = 99;

  message Ext {
    extensions 500 to max;
  }
}

// AdCOM 1.0 Object: Extended Identifiers. Extended identifiers support in the
// OpenRTB specification allows buyers to use audience data in real-time bidding.
// The exchange should ensure that business agreements allow for the sending of
// this data. Note, it is assumed that exchanges and DSPs will collaborate with
// the appropriate regulatory agencies and ID vendor(s) to ensure compliance.
message Eid {

  // Source domain of the UID provider. Should be the root domain name of the
  // provider, not the URL. For example, "liveramp.com" not
  // "https://liveramp.com/connect"
  string source = 1;

  // Array of extended ID UID objects from the given source. Refer to Object:
  // Extended Identifier UIDs.
  repeated Uid uids = 2;

  // The canonical domain name of the entity (publisher, publisher monetization
  // company, SSP, Exchange, Header Wrapper, etc.) that caused the ID array
  // element to be added. This may be the operational domain of the system, if
  // that is different from the parent corporate domain, to facilitate WHOIS and
  // reverse IP lookups to establish clear ownership of the delegate system. This
  // should be the same value as used to identify sellers in an ads.txt file if
  // one exists. For ad tech intermediaries, this would be the domain as used in
  // ads.txt. For publishers, this would match the domain in the `site` or `app`
  // object.
  string inserter = 3;

  // Technology providing the match method as defined in `mm`. In some cases,
  // this may be the same value as inserter. When blank, it is assumed that the
  // `matcher` is equal to the `source` May be omitted when mm=0, 1, or 2.
  string matcher = 4;

  // Match method used by the `matcher`. Refer to List: ID Match Methods.
  com.iabtechlab.adcom.v1.enums.MatchMethod mm = 5;

  // Optional vendor-specific extensions.
  Ext ext = 99;

  message Ext {
    extensions 500 to max;
  }
}

// AdCOM 1.0 Object: Extended Identifier UIDs.
message Uid {

  // Cookie or platform-native identifier.
  string id = 1;

  // Type of user agent the match is from. It is highly recommended to set this,
  // as many DSPs separate app-native IDs from browser-based IDs and require a
  // type value for ID resolution. Refer to List: Agent Types.
  com.iabtechlab.adcom.v1.enums.AgentType atype = 2;

  // Optional vendor-specific extensions.
  Ext ext = 99;

  message Ext {
    extensions 500 to max;
  }
}

// AdCOM 1.0 Object: Regs. This object contains any known legal, governmental, or
// industry regulations that are in effect.
message Regs {

  // Flag indicating if COPPA regulations apply, where 0 = no, 1 = yes. The
  // Children's Online Privacy Protection Act (COPPA) was established by the U.S.
  // Federal Trade Commission.
  bool coppa = 1;

  // Flag indicating if GDPR regulations apply, where 0 = no, 1 = yes. The
  // General Data Protection Regulation (GDPR) is a regulation of the European
  // Union.
  bool gdpr = 2;

  // Contains the Global Privacy Platform’s consent string. See the Global
  // Privacy Platform specification for more details.
  string gpp = 3;

  // Array of the section(s) of the string which should be applied for this
  // transaction. Generally will contain one and only one value, but there are
  // edge cases where more than one may apply. GPP Section 3 (Header) and 4
  // (Signal Integrity) do not need to be included. See the GPP Section
  // Information for more details.
  repeated int32 gpp_sid = 4;

  // Optional vendor-specific extensions.
  Ext ext = 99;

  message Ext {
    extensions 500 to max;
  }
}

// AdCOM 1.0 Object: Restrictions. This object allows lists of restrictions on ad
// responses to be specified including specific content categories, advertisers,
// ads pertaining to specific apps, or creative attributes.
message Restrictions {

  // Allowed content categories using IDs from the taxonomy indicated in cattax.
  // Only one of acat or bcat should be present.
  repeated string acat = 1;

  // Block list of content categories using IDs from the taxonomy indicated in
  // cattax. Only one of acat or bcat should be present.
  repeated string bcat = 2;

  // The taxonomy in use for the bcat attribute. Refer to List: Category
  // Taxonomies.
  com.iabtechlab.adcom.v1.enums.CategoryTaxonomy cattax = 3 [default = CATEGORY_TAXONOMY_CONTENT_CATEGORY_2_0];

  // Block list of advertisers by their domains (e.g., “ford.com”).
  repeated string badv = 4;

  // Block list of apps for which ads are disallowed. These should be bundle or
  // package names (e.g., “com.foo.mygame”) and should NOT be app store IDs
  // (e.g., not iTunes store IDs).
  repeated string bapp = 5;

  // Block list of creative attributes. Refer to List: Creative Attributes.
  repeated com.iabtechlab.adcom.v1.enums.CreativeAttribute battr = 6;

  // Optional vendor-specific extensions.
  Ext ext = 99;

  message Ext {
    extensions 500 to max;
  }
}

